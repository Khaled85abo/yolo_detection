<!DOCTYPE html>
<html>

<head>
    <title>Plank Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="{{ url_for('static', filename='watch-styles.css') }}">
    <script src="{{ url_for('static', filename='watch-script.js') }}" defer></script>
</head>

<body>
    <div class="watch-container">
        <!-- Status Screen -->
        <div class="screen" id="status-screen">
            <div class="screen-title">System Status</div>
            <div id="status">
                <p>Loading...</p>
            </div>
            <div class="connection-status">
                <span class="status-indicator status-initializing"></span>
                <span id="connection-status">Connecting...</span>
            </div>
            <div class="nav-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <!-- Controls Screen -->
        <div class="screen" id="controls-screen">
            <div class="screen-title">Controls</div>
            <div class="controls">
                <button class="btn-stop" onclick="controlConveyor(true)">STOP</button>
                <button class="btn-start" onclick="controlConveyor(false)">START</button>
            </div>
            <div class="nav-dots">
                <span class="dot"></span>
                <span class="dot active"></span>
                <span class="dot"></span>
            </div>
        </div>

        <!-- Rules Screen -->
        <div class="screen" id="rules-screen">
            <div class="screen-title">Rules</div>
            <div class="rule-container">
                <!-- Rules will be populated by JavaScript -->
            </div>
            <button class="btn-save-rules">Save</button>
            <div class="nav-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot active"></span>
            </div>
        </div>
    </div>
</body>

</html>
