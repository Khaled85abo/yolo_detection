<!DOCTYPE html>
<html>

<head>
    <title>Plank Detection System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>

<body>
    <div class="container">
        <h1>Plank Detection System</h1>

        <!-- Camera Feeds -->
        {% for camera_id in camera_ids %}
        <div class="camera-feed">
            <h2>Camera {{ camera_id }}</h2>
            <img src="/video_feed/{{ camera_id }}" width="{{ frame_sizes[camera_id][0] }}"
                height="{{ frame_sizes[camera_id][1] }}" />
        </div>
        {% endfor %}

        <div class="status" id="status">
            <p>Loading status...</p>
        </div>

        <div class="controls">
            <button class="btn-stop" onclick="controlConveyor(true)">Stop Conveyor</button>
            <button class="btn-start" onclick="controlConveyor(false)">Start Conveyor</button>
        </div>

        <!-- Rule Configuration Section -->
        <div class="rule-configuration">
            <h2>Rule Configuration</h2>
            <div class="rule-container">
                <div class="rule-item">
                    <h3>When Overlap Detected:</h3>
                    <select id="overlap-action" onchange="updateRule('overlap', this.value)">
                        <option value="ignore">Ignore</option>
                        <option value="stop_conveyor">Stop Conveyor</option>
                        <option value="alert">Alert Only</option>
                    </select>
                </div>

                <div class="rule-item">
                    <h3>When Stopped Plank Detected:</h3>
                    <select id="stop-action" onchange="updateRule('stop', this.value)">
                        <option value="ignore">Ignore</option>
                        <option value="stop_conveyor">Stop Conveyor</option>
                        <option value="alert">Alert Only</option>
                    </select>
                </div>

                <div class="rule-item">
                    <h3>When Incorrect Plank Detected:</h3>
                    <select id="incorrect-action" onchange="updateRule('incorrect', this.value)">
                        <option value="ignore">Ignore</option>
                        <option value="stop_conveyor">Stop Conveyor</option>
                        <option value="alert">Alert Only</option>
                    </select>
                </div>
            </div>
            <button class="btn-save-rules">Save Rules</button>
        </div>
    </div>

    <!-- Connection Status Display -->
    <div class="connection-status">
        <span class="status-indicator status-initializing"></span>
        <span id="connection-status">Initializing...</span>
    </div>

</body>

</html>
